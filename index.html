
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbsarLearn - Free Study Materials</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fc;color:#17233c}
header{background:#142b55;color:white;padding:22px 18px}
.logo{font-size:28px;font-weight:bold}
header p{color:#d4e2ff;margin-bottom:0}
main{max-width:1050px;margin:auto;padding:20px}
.hero{background:linear-gradient(130deg,#174b9b,#397bea);color:white;padding:35px 22px;border-radius:18px}
.hero h1{font-size:30px;margin:0 0 10px}
.hero p{line-height:1.6}
.search{width:100%;padding:15px;border:1px solid #dce2ed;border-radius:12px;font-size:16px;margin:22px 0}
h2{font-size:21px}
.subjects{display:flex;gap:10px;flex-wrap:wrap}
.subject{background:white;border:1px solid #dce2ed;padding:11px 16px;border-radius:22px;cursor:pointer}
.subject.active{background:#174b9b;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:16px}
.card{background:white;padding:19px;border-radius:15px;border:1px solid #e5eaf2}
.card .emoji{font-size:30px}
.card h3{margin:12px 0 7px}
.card p{color:#64718a;font-size:14px;line-height:1.5}
.card a{display:inline-block;background:#174b9b;color:white;text-decoration:none;padding:11px 16px;border-radius:9px;margin:5px 5px 0 0}
.status{text-align:center;padding:25px;color:#64718a}
footer{text-align:center;padding:28px;color:#718096}
</style>
</head>
<body>

<header>
<div class="logo">📘 AbsarLearn</div>
<p>Free online study materials for every student.</p>
</header>

<main>
<section class="hero">
<h1>Learn More. Achieve More.</h1>
<p>Explore free notes, PDF books and study materials.
Your learning journey starts here!</p>
</section>

<input class="search" id="search"
placeholder="🔍 Search notes and study materials...">

<h2>Explore Subjects</h2>
<div class="subjects" id="subjects">
<button class="subject active" data-category="All">All</button>
</div>

<h2>Study Materials</h2>
<div id="status" class="status">Loading study materials...</div>
<div class="grid" id="materials"></div>
</main>

<footer>© 2026 AbsarLearn | Learn for Free ❤️</footer>

<script>
const SUPABASE_URL =
'https://wwxlbgsjctqztmsbyqdd.supabase.co';

const SUPABASE_KEY =
'sb_publishable_p14XldBHjG-gdiU_F4p6Dg_a7lXirZA';

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allMaterials = [];
let activeCategory = 'All';

function safe(value) {
return String(value ?? '').replace(/[&<>"']/g, c => ({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[c]));
}

function fileUrl(path) {
if (!path) return '';

if (/^https?:\/\//i.test(path)) return path;

let cleanPath = path.replace(/^\/+/, '');

if (cleanPath.startsWith('absarlearn-files/')) {
cleanPath = cleanPath.substring('absarlearn-files/'.length);
}

const {data} = db.storage
.from('absarlearn-files')
.getPublicUrl(cleanPath);

return data.publicUrl;
}

function makeSubjects() {
const categories = [
...new Set(allMaterials.map(m => m.category).filter(Boolean))
];

document.getElementById('subjects').innerHTML =
['All', ...categories].map(category => `
<button class="subject ${category === 'All' ? 'active' : ''}"
data-category="${safe(category)}">
${safe(category)}
</button>
`).join('');

document.querySelectorAll('.subject').forEach(button => {
button.addEventListener('click', () => {
activeCategory = button.dataset.category;

document.querySelectorAll('.subject').forEach(b =>
b.classList.remove('active')
);

button.classList.add('active');
showMaterials();
});
});
}

function showMaterials() {
const query = document.getElementById('search')
.value.toLowerCase();

const filtered = allMaterials.filter(m => {
const matchesCategory =
activeCategory === 'All' ||
m.category === activeCategory;

const matchesSearch =
`${m.title} ${m.description || ''} ${m.category || ''}`
.toLowerCase().includes(query);

return matchesCategory && matchesSearch;
});

const container = document.getElementById('materials');

if (!filtered.length) {
container.innerHTML = '';
document.getElementById('status').textContent =
allMaterials.length
? 'No matching study materials found.'
: 'No study materials uploaded yet. Please visit again soon.';
return;
}

document.getElementById('status').textContent = '';

container.innerHTML = filtered.map(m => {
const url = fileUrl(m.file_path);
const isPdf = (m.file_type || m.file_name || '')
.toLowerCase().includes('pdf');

return `
<div class="card">
<div class="emoji">${isPdf ? '📕' : '📚'}</div>
<h3>${safe(m.title)}</h3>
<p>${safe(m.description || 'Study material')}</p>
<p><b>Subject:</b> ${safe(m.category || 'Other')}</p>
${url ? `
<a href="${safe(url)}" target="_blank"
rel="noopener noreferrer">View Material</a>
<a href="${safe(url)}" download
rel="noopener noreferrer">Download</a>
` : '<p>File link unavailable</p>'}
</div>
`;
}).join('');
}

async function loadMaterials() {
try {
const {data, error} = await db
.from('study_materials')
.select('id,title,description,category,file_name,file_path,file_type,is_published,created_at')
.eq('is_published', true)
.order('created_at', {ascending: false});

if (error) throw error;

allMaterials = data || [];
makeSubjects();
showMaterials();

} catch (error) {
console.error(error);
document.getElementById('status').textContent =
'Unable to load materials. Please check your Supabase settings and connection.';
}
}

document.getElementById('search')
.addEventListener('input', showMaterials);

loadMaterials();
</script>

</body>
</html>
